# PhotoLean 项目契约 — 形式化引擎的叶子数据面（leaf data plane）
# English: PhotoLean project contract — the leaf data plane of the formalization engine
#
# 这是"项目无关形式化引擎"与本项目之间的唯一接口。引擎（Agent preset）
# English: This is the only interface between the "project-agnostic formalization engine" and this project. The engine (Agent preset)
# 只按本文件的声明工作；换一个唯象理论 = 换一个仓库 + 重写本文件，
# English: works only from this file's declarations; switching to another phenomenological theory = switching to another repository + rewriting this file,
# 而不是改 preset。
# English: rather than modifying the preset.
#
# 本文件是 shell 可 source 的 KEY=VALUE 格式（无嵌套、无 YAML 依赖），
# English: This file is in shell-sourceable KEY=VALUE format (no nesting, no YAML dependency),
# 因此 proofs/scripts/*.sh 与 Agent 读到的信息永远一致 —— 单一真源。
# English: so proofs/scripts/*.sh and the Agent always read identical information — a single source of truth.
#
# 校验：proofs/scripts/check.sh 会检查本文件声明的必需叶子是否存在。
# English: Validation: proofs/scripts/check.sh checks that the required leaves declared in this file exist.

# ── 身份 ────────────────────────────────────────────────────────────────────
# English: ── Identity ──
PROJECT_NAME="PhotoLean"
PROJECT_DOMAIN="光化学与光物理唯象理论（光致发光、非辐射衰减、构象与几何约束效应）"

# ── 形式化目标 ──────────────────────────────────────────────────────────────
# English: ── Formalization goals ──
# Lean 库名前缀；SOURCE_DIRS 内所有 *.lean 都会纳入 sorry/axiom 扫描。
# English: Lean library-name prefix; all *.lean under SOURCE_DIRS are included in the scan for unproved placeholders and axioms.
MODULE_PREFIX="PhotoLean"
SOURCE_DIRS="PhotoLean"

# ── 纪律（硬约束，引擎的验收门读这里）────────────────────────────────────────
# English: ── Discipline (hard constraints; the engine's acceptance gate reads these here) ──
# 交付定理允许出现的公理：仅 mathlib 基础设施。sorryAx 与自定义 axiom 一律 FAIL。
# English: Axioms permitted in delivered theorems: only mathlib infrastructure. Unproved placeholders and custom axioms are always FAIL.
ALLOWED_AXIOMS="propext Classical.choice Quot.sound"
FORBID_SORRY=1
FORBID_CUSTOM_AXIOM=1

# ── 叶子数据面（每项都是相对仓库根的路径，必须存在）────────────────────────
# English: ── Leaf data plane (each entry is a path relative to the repository root, and must exist) ──
PLAN="theories/Marcus/plan.md"                          # 理论规划：里程碑、语句、证明草图、sprint 顺序
                                        # English: Theory plan: milestones, statements, proof sketches, sprint order
TASKS="theories/Marcus/TASKS.md"                 # 任务板：状态唯一真源
                                        # English: Task board: the single source of truth for status
EXPERIENCE="proofs/EXPERIENCE.md"       # 经验库（Hyra 式）：跨轮积累的成败模式
                                        # English: Experience bank (Hyra-style): success/failure patterns accumulated across rounds
API_NOTES="proofs/API-NOTES.md"         # mathlib API 校准日志
                                        # English: mathlib API calibration log
LITERATURE="theories/Marcus/LITERATURE.md"       # 文献调研记录：源、结论、对本理论的可形式化含义
                                        # English: Literature survey record: sources, conclusions, formalizable implications for this theory
PROBES="theories/Marcus/probes"                  # #check 探针目录
                                        # English: #check probe directory
# 引擎与理论分离：`proofs/` 只放引擎本身（契约、脚本、跨理论的经验库与 API 校准），
# 每个理论的叶子（规划/任务板/文献/探针/结果）放在 `theories/<理论名>/` 下。
# 新增一个理论 = 新建 `theories/<理论名>/` 与 `PhotoLean/<理论名>/`，并把上面的叶子路径指向它。
# （跨理论共享的两个叶子保持引擎级：EXPERIENCE 经验库、API-NOTES mathlib 校准。）
                                        # English: #check probe directory

# ── 面向人类的最终交付物（唯一的双语文件）──────────────────────────────────
# English: ── Final human-facing deliverable (the ONLY bilingual file) ──
# 语言政策：仓库内一切证明过程产物（上列各叶子）、代码注释与 commit message 写英文；
# 与人类的对话用中文；只有本文件是双语的 —— 每节英文原文后紧跟中文对照。
# English: Language policy: every in-repo proof-process artifact (the leaves above),
# English: code comments and commit messages are written in English; conversation with
# English: the human is in Chinese; ONLY this file is bilingual — each section carries
# English: the English original immediately followed by its Chinese rendering.
# 禁止维护 .en.md / -en.md / .zh.md 一类翻译镜像：一个产物写一次，写英文。
# English: Never maintain translated mirror copies such as .en.md / -en.md / .zh.md:
# English: an artifact is written once, in English.
RESULT="theories/Marcus/RESULTS.md"

# ── 验证器命令（引擎调用这些，不内联任何判据）──────────────────────────────
# English: ── Verifier commands (the engine calls these; no criteria are inlined) ──
CHECK_CMD="proofs/scripts/check.sh --strict"
AXIOMS_CMD="proofs/scripts/axioms.sh"
BUILD_CMD="lake build"

# ── 提交规范 ────────────────────────────────────────────────────────────────
# English: ── Commit conventions ──
# 每 lemma 一个 commit；<area> 对应 theories/Marcus/plan.md 的里程碑编号（如 M1）。
# English: One commit per lemma; <area> corresponds to the milestone number in theories/Marcus/plan.md (e.g. M1).
COMMIT_TEMPLATE="feat(<area>): <lemma>"

# ── 多理论数据面（引擎扩展：一个仓库可承载多个理论）────────────────────────────
# English: ── Multi-theory data plane (engine extension: one repository may host several theories) ──
# 上面的 PLAN/TASKS/LITERATURE/PROBES/RESULT 是"规范理论"（Marcus）的叶子；
# English: The PLAN/TASKS/LITERATURE/PROBES/RESULT entries above are the leaves of the canonical theory (Marcus);
# 追加理论用 <LEAF>_<theory> 命名（<theory> 纯小写、与 theories/<theory> 目录同名）。
# English: additional theories declare their leaves as <LEAF>_<theory> (<theory> lowercase, matching theories/<theory>).
# check.sh 对 THEORIES 的每个理论逐项做叶子存在性检查（缺任何一个 = FAIL）。
# English: check.sh performs the leaf-existence check for every theory listed in THEORIES (a missing leaf = FAIL).
# 另有一遍**目录遍历**（与上面的变量机制并存、互不替代）：<THEORIES_DIR>/*/ 每个理论目录
# 必须含五项 plan.md / TASKS.md / LITERATURE.md / RESULTS.md / probes/，缺项 = FAIL。
# English: a second, directory-sweeping pass coexists with the variable mechanism above (neither replaces the other):
# English: every theory directory under <THEORIES_DIR>/*/ must carry five items — plan.md / TASKS.md /
# English: LITERATURE.md / RESULTS.md / probes/ — and a missing item = FAIL.
# 为什么两套都要：变量机制只覆盖**显式列进 THEORIES** 的理论，新建目录会被静默漏过（曾实测如此）；
# 目录遍历自动覆盖任何新理论，专门拦"半初始化的理论目录"。
# English: Why both: the variable mechanism only covers theories explicitly listed in THEORIES, so a new directory
# English: is silently skipped (measured); the sweep covers any new theory and exists to catch half-initialised ones.
# SOURCE_DIRS 保持全局：任何交付源码都必须落在扫描范围内，否则验收门覆盖不到。
# English: SOURCE_DIRS stays global: every delivered source must lie inside the scan range, otherwise the gate cannot see it.
# 理论根目录：check.sh 的第二遍遍历扫 <THEORIES_DIR>/*/。
# English: Theories root: the second pass of check.sh sweeps <THEORIES_DIR>/*/.
THEORIES_DIR="theories"
THEORIES="Marcus hammond BEP kasha Sabatier goldschmidt SymmetryFactor"
PLAN_Marcus="theories/Marcus/plan.md"
TASKS_Marcus="theories/Marcus/TASKS.md"
LITERATURE_Marcus="theories/Marcus/LITERATURE.md"
PROBES_Marcus="theories/Marcus/probes"
RESULT_Marcus="theories/Marcus/RESULTS.md"
PLAN_hammond="theories/hammond/plan.md"
TASKS_hammond="theories/hammond/TASKS.md"
LITERATURE_hammond="theories/hammond/LITERATURE.md"
PROBES_hammond="theories/hammond/probes"
RESULT_hammond="theories/hammond/RESULTS.md"
PLAN_BEP="theories/BEP/plan.md"
TASKS_BEP="theories/BEP/TASKS.md"
LITERATURE_BEP="theories/BEP/LITERATURE.md"
PROBES_BEP="theories/BEP/probes"
RESULT_BEP="theories/BEP/RESULTS.md"
PLAN_kasha="theories/kasha/plan.md"
TASKS_kasha="theories/kasha/TASKS.md"
LITERATURE_kasha="theories/kasha/LITERATURE.md"
PROBES_kasha="theories/kasha/probes"
RESULT_kasha="theories/kasha/RESULTS.md"
PLAN_Sabatier="theories/Sabatier/plan.md"
TASKS_Sabatier="theories/Sabatier/TASKS.md"
LITERATURE_Sabatier="theories/Sabatier/LITERATURE.md"
PROBES_Sabatier="theories/Sabatier/probes"
RESULT_Sabatier="theories/Sabatier/RESULTS.md"
PLAN_goldschmidt="theories/goldschmidt/plan.md"
TASKS_goldschmidt="theories/goldschmidt/TASKS.md"
LITERATURE_goldschmidt="theories/goldschmidt/LITERATURE.md"
PROBES_goldschmidt="theories/goldschmidt/probes"
RESULT_goldschmidt="theories/goldschmidt/RESULTS.md"
PLAN_SymmetryFactor="theories/SymmetryFactor/plan.md"
TASKS_SymmetryFactor="theories/SymmetryFactor/TASKS.md"
LITERATURE_SymmetryFactor="theories/SymmetryFactor/LITERATURE.md"
PROBES_SymmetryFactor="theories/SymmetryFactor/probes"
RESULT_SymmetryFactor="theories/SymmetryFactor/RESULTS.md"
