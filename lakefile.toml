# PhotoLean — 光化学/光物理唯象理论的 Lean 4 形式化工程。
# English: PhotoLean — a Lean 4 formalization project for phenomenological photochemistry/photophysics theory.
# Lake 5.0.0 (Lean 4.17.0) TOML 格式。
# English: Lake 5.0.0 (Lean 4.17.0) TOML format.
#
# 关键约束：mathlib 的 rev 必须与 lean-toolchain 的版本一致，
# English: Key constraint: the mathlib rev must match the version of lean-toolchain,
# 否则 olean 缓存不匹配、全量重建（数小时）。见 proofs/ENGINE.md §工具链。
# English: otherwise the olean cache mismatches and a full rebuild (hours) is triggered. See proofs/ENGINE.md §Toolchain.

name = "PhotoLean"
version = "0.1.0"
# 裸跑 `proofs/scripts/check.sh --strict` 会构建这里的全部模块 ——
# English: Running `proofs/scripts/check.sh --strict` bare builds every module listed here —
# 交付一个新模块就补一行（否则扫描覆盖全目录、构建却不覆盖，是个验收漏洞）。
# English: add one line whenever a new module is delivered (otherwise the scan covers the whole directory while the build does not — an acceptance hole).
defaultTargets = ["PhotoLean.Smoke", "PhotoLean.Marcus.Basic", "PhotoLean.Marcus.Reorg",
                  "PhotoLean.Marcus.Barrier", "PhotoLean.Marcus.Rate", "PhotoLean.Marcus.RatModel",
                  "PhotoLean.Marcus.Sharp", "PhotoLean.Marcus.Compose",
                  "PhotoLean.Marcus.Instances",
                  "PhotoLean.Hammond.Basic", "PhotoLean.Hammond.RatModel",
                  "PhotoLean.Hammond.Criterion", "PhotoLean.Hammond.Compose",
                  "PhotoLean.Hammond.Sharp", "PhotoLean.Hammond.Instances",
                  "PhotoLean.BEP.Basic", "PhotoLean.BEP.Criterion",
                  "PhotoLean.BEP.Compose", "PhotoLean.BEP.RatModel",
                  "PhotoLean.BEP.Sharp", "PhotoLean.BEP.Instances",
                  "PhotoLean.Kasha.Basic", "PhotoLean.Kasha.Criterion",
                  "PhotoLean.Kasha.Compose", "PhotoLean.Kasha.RatModel",
                  "PhotoLean.Kasha.Sharp", "PhotoLean.Kasha.Instances",
                  "PhotoLean.Kernel", "PhotoLean.Relations",
                  "PhotoLean.Goldschmidt.Basic", "PhotoLean.Goldschmidt.Rules",
                  "PhotoLean.Goldschmidt.Criterion",
                  "PhotoLean.Goldschmidt.Sharp",
                  "PhotoLean.Goldschmidt.RatModel",
                  "PhotoLean.Goldschmidt.Instances",
                  "PhotoLean.Sabatier.Basic", "PhotoLean.Sabatier.Criterion",
                  "PhotoLean.Sabatier.Sharp", "PhotoLean.Sabatier.Compose",
                  "PhotoLean.Sabatier.RatModel", "PhotoLean.Sabatier.Instances",
                  "PhotoLean.SymmetryFactor.Basic", "PhotoLean.SymmetryFactor.Criterion",
                  "PhotoLean.SymmetryFactor.Sharp", "PhotoLean.SymmetryFactor.RatModel",
                  "PhotoLean.SymmetryFactor.Instances",
                  "PhotoLean.StokesShift.Basic", "PhotoLean.StokesShift.Criterion",
                  "PhotoLean.StokesShift.RatModel", "PhotoLean.StokesShift.Instances",
                  "PhotoLean.SternVolmer.Basic", "PhotoLean.SternVolmer.Criterion",
                  "PhotoLean.SternVolmer.RatModel", "PhotoLean.SternVolmer.Instances",
                  "PhotoLean.KashaVavilov.Basic", "PhotoLean.KashaVavilov.Criterion",
                  "PhotoLean.KashaVavilov.Instances",
                  "PhotoLean.Einstein.Basic", "PhotoLean.Einstein.Criterion",
                  "PhotoLean.Einstein.RatModel", "PhotoLean.Einstein.Instances",
                  "PhotoLean.QuantumYield.Basic", "PhotoLean.QuantumYield.Criterion",
                  "PhotoLean.QuantumYield.RatModel", "PhotoLean.QuantumYield.Instances",
                  "PhotoLean.EnergyGapLaw.Basic", "PhotoLean.EnergyGapLaw.Criterion",
                  "PhotoLean.EnergyGapLaw.Sharp", "PhotoLean.EnergyGapLaw.RatModel",
                  "PhotoLean.EnergyGapLaw.Instances",
                  "PhotoLean.Forster.Basic", "PhotoLean.Forster.Criterion",
                  "PhotoLean.Forster.RatModel", "PhotoLean.Forster.Instances",
                  "PhotoLean.ICvsISC.Basic", "PhotoLean.ICvsISC.Criterion",
                  "PhotoLean.ICvsISC.RatModel", "PhotoLean.ICvsISC.Instances"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.17.0"

[[lean_lib]]
name = "PhotoLean"
